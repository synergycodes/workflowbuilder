<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="558" viewBox="0 0 840 372" role="img" aria-labelledby="title">
  <title id="title">Arrows from left to right follow a run: your React app sends the diagram to your server; your server, through the Workflow Builder TemporalWorkflowEngine, starts a run on the Temporal Service; Temporal sends tasks to your Worker, where the WorkflowBuilderPlugin walks the graph and calls your executors; the Worker returns results; your Worker writes run events to your database; optionally, the events go back to the canvas</title>
  <style>
    text { font-family: ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif; }
    .title { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 11px; text-anchor: middle; }
    .pkg { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; text-anchor: middle; }
    .wb rect { fill: #311452; stroke: #7a26d9; }
    .wb .title { fill: #ffffff; }
    .wb .pkg { fill: #bc89f5; }
    .wb .sub { fill: #e4d3fb; }
    .own rect { fill: #353841; stroke: #555962; }
    .own .title { fill: #ffffff; }
    .own .sub { fill: #c1c3c8; }
    .temporal rect { fill: #edeef3; }
    .temporal .title { fill: #17181c; }
    .temporal .sub { fill: #555962; }
    .frame { fill: none; stroke: #888c96; stroke-dasharray: 6 4; }
    .frame-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; fill: #c1c3c8; }
    .legend { font-size: 12px; fill: #c1c3c8; }
    .flow { fill: none; stroke: #c1c3c8; stroke-width: 1.5; marker-end: url(#arrow); }
    .optional { stroke-dasharray: 5 4; }
    .label { font-size: 11px; fill: #c1c3c8; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c1c3c8"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="839" height="371" rx="12" fill="#23262f" stroke="#353841"/>

  <g class="legend">
    <rect x="16" y="20" width="14" height="14" rx="4" fill="#311452" stroke="#7a26d9"/>
    <text x="38" y="32">Workflow Builder</text>
    <rect x="154" y="20" width="14" height="14" rx="4" fill="#edeef3"/>
    <text x="176" y="32">Temporal</text>
    <rect x="254" y="20" width="14" height="14" rx="4" fill="#353841" stroke="#555962"/>
    <text x="276" y="32">Your code</text>
    <rect x="358" y="20" width="14" height="14" rx="4" class="frame"/>
    <text x="380" y="32">Process you run</text>
  </g>

  <rect class="frame" x="12" y="56" width="192" height="206" rx="10"/>
  <text class="frame-label" x="20" y="76">YOUR REACT APP</text>
  <rect class="frame" x="252" y="56" width="192" height="206" rx="10"/>
  <text class="frame-label" x="260" y="76">YOUR SERVER</text>
  <rect class="frame" x="636" y="56" width="192" height="206" rx="10"/>
  <text class="frame-label" x="644" y="76">YOUR WORKER</text>

  <g class="wb">
    <rect x="20" y="88" width="176" height="48" rx="8"/>
    <text class="title" x="108" y="108">Workflow Builder editor</text>
    <text class="pkg" x="108" y="124">@workflowbuilder/sdk</text>
  </g>
  <g class="own">
    <rect x="20" y="146" width="176" height="48" rx="8"/>
    <text class="title" x="108" y="166">Run button</text>
    <text class="sub" x="108" y="182">a small plugin</text>
  </g>
  <g class="own">
    <rect x="20" y="204" width="176" height="48" rx="8"/>
    <text class="title" x="108" y="224">Run markers</text>
    <text class="sub" x="108" y="240">optional, as in the example</text>
  </g>

  <g class="own">
    <rect x="260" y="88" width="176" height="48" rx="8"/>
    <text class="title" x="348" y="108">Mapper</text>
    <text class="sub" x="348" y="124">diagram to definition</text>
  </g>
  <g class="wb">
    <rect x="260" y="146" width="176" height="48" rx="8"/>
    <text class="title" x="348" y="166">TemporalWorkflowEngine</text>
    <text class="pkg" x="348" y="182">@workflowbuilder/temporal</text>
  </g>

  <g class="temporal">
    <rect x="492" y="56" width="96" height="206" rx="8"/>
    <text class="title" x="540" y="129">Temporal</text>
    <text class="title" x="540" y="145">Service</text>
    <text class="sub" x="540" y="167">run state</text>
    <text class="sub" x="540" y="182">Event History</text>
    <text class="sub" x="540" y="197">retries</text>
  </g>

  <g class="wb">
    <rect x="644" y="88" width="176" height="48" rx="8"/>
    <text class="title" x="732" y="108">WorkflowBuilderPlugin</text>
    <text class="sub" x="732" y="124">runWorkflow walks the graph</text>
  </g>
  <g class="own">
    <rect x="644" y="146" width="176" height="48" rx="8"/>
    <text class="title" x="732" y="166">Executors</text>
    <text class="sub" x="732" y="182">one per node type</text>
  </g>
  <g class="own">
    <rect x="644" y="204" width="176" height="48" rx="8"/>
    <text class="title" x="732" y="224">Store adapter</text>
    <text class="sub" x="732" y="240">writes run events</text>
  </g>

  <g class="own">
    <rect x="636" y="310" width="192" height="48" rx="8"/>
    <text class="title" x="732" y="330">Your database</text>
    <text class="sub" x="732" y="346">run events, statuses</text>
  </g>

  <!-- Arrows connect processes, not the boxes inside them, and each one sits lower than the one before. -->
  <path class="flow" d="M204,100 H251"/>
  <path class="flow" d="M444,140 H491"/>
  <path class="flow" d="M588,180 H635"/>
  <path class="flow" d="M636,210 H589"/>
  <path class="flow" d="M732,262 V309"/>
  <path class="flow optional" d="M636,334 H108 V263"/>

  <text class="label" x="228" y="92">diagram</text>
  <text class="label" x="468" y="132">start run</text>
  <text class="label" x="612" y="172">tasks</text>
  <text class="label" x="612" y="226">results</text>
  <text class="label" x="742" y="290" style="text-anchor: start">events</text>
  <text class="label" x="372" y="326">events back to the canvas (optional)</text>
</svg>
