name: wb-e2e

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wb
      POSTGRES_PASSWORD: wb
    ports:
      - '127.0.0.1:5442:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wb -d postgres']
      interval: 1s
      timeout: 3s
      retries: 30
