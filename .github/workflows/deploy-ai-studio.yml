name: Deploy AI Studio

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (defaults to short SHA)'
        required: false

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: synergycodes.azurecr.io
  APP: wb-ai-studio

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          echo "value=${TAG::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name synergycodes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/ai-studio/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP }}:${{ steps.tag.outputs.value }}-runtime
            ${{ env.REGISTRY }}/${{ env.APP }}:latest-runtime
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP }}:latest-runtime
          cache-to: type=inline

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/ai-studio/Dockerfile
          target: web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP }}:${{ steps.tag.outputs.value }}-web
            ${{ env.REGISTRY }}/${{ env.APP }}:latest-web
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP }}:latest-web
          cache-to: type=inline
          build-args: |
            VITE_BACKEND_URL=

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The VM runs the repo's compose files, shipped here on every deploy (base64,
      # so the script stays free of quoting). Compose is run from the project
      # directory, not with -f: that is what applies docker-compose.override.yml
      # by default and honours COMPOSE_FILE from the VM's .env.
      - name: Refresh docker compose on Azure VM
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.APP }}:${{ needs.build-and-push.outputs.image_tag }}
        run: |
          COMPOSE_B64=$(base64 -w0 deploy/ai-studio/docker-compose.yml)
          OVERRIDE_B64=$(base64 -w0 deploy/ai-studio/docker-compose.override.yml)
          SCRIPT=$(cat <<EOF
          set -e
          cd /app/ai-studio
          echo "$COMPOSE_B64" | base64 -d > docker-compose.yml
          echo "$OVERRIDE_B64" | base64 -d > docker-compose.override.yml
          export RUNTIME_IMAGE="$IMAGE-runtime" WEB_IMAGE="$IMAGE-web"
          az acr login --name synergycodes
          docker compose pull
          docker compose up -d --no-build --force-recreate --remove-orphans
          echo DEPLOY_SCRIPT_SUCCEEDED
          EOF
          )
          OUTPUT=$(az vm run-command invoke \
            --name ${{ vars.AI_STUDIO_VM_NAME }} \
            --resource-group ${{ vars.AI_STUDIO_VM_RG }} \
            --command-id RunShellScript \
            --scripts "$SCRIPT")
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q DEPLOY_SCRIPT_SUCCEEDED
