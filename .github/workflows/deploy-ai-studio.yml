name: Deploy AI Studio

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (defaults to short SHA)'
        required: false

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: ${{ vars.AZURE_REGISTRY_NAME }}.azurecr.io
  APP: wb-ai-studio
  # Release tag of synergycodes/hubspot-contact-form to embed. Bump to pull a newer widget.
  CONTACT_FORM_VERSION: v0.1.3
  CONTACT_FORM_HEADER: 'Rolling out Workflow Builder at your company?'
  CONTACT_FORM_DESCRIPTION: 'Start with a free 30-minute call with the engineers who created Workflow Builder.'
  CONTACT_FORM_SUBMIT_LABEL: 'Request a call'
  # Seconds before exit intent arms: long enough to be past the welcome dialog.
  CONTACT_FORM_ARM_DELAY: '60'
  CONTACT_FORM_FOOTER: 'Building on your own?'
  CONTACT_FORM_FOOTER_LINK_LABEL: 'See the code on GitHub'
  CONTACT_FORM_FOOTER_LINK_URL: 'https://github.com/synergycodes/workflowbuilder'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag || github.sha }}"
          echo "value=${TAG::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.AZURE_REGISTRY_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/ai-studio/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP }}:${{ steps.tag.outputs.value }}-runtime
            ${{ env.REGISTRY }}/${{ env.APP }}:latest-runtime
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP }}:latest-runtime
          cache-to: type=inline

      # The public demo carries the HubSpot contact form; the stock `web` target does not.
      # Both files land in the build context for the `web-demo` target. For a private
      # hubspot-contact-form repo, set the CONTACT_FORM_TOKEN secret (read access to it).
      - name: Fetch contact-form widget
        env:
          GH_TOKEN: ${{ secrets.CONTACT_FORM_TOKEN || github.token }}
        run: |
          gh release download "$CONTACT_FORM_VERSION" \
            --repo synergycodes/hubspot-contact-form \
            --pattern contact-form.js \
            --output deploy/ai-studio/contact-form/contact-form.js --clobber

      # The ids are not secret (they show in the page source); variables keep them out of the repo.
      # The version in the URL makes a widget bump bypass the browser cache.
      - name: Write contact-form script tag
        env:
          HUBSPOT_PORTAL_ID: ${{ vars.HUBSPOT_PORTAL_ID }}
          HUBSPOT_FORM_ID: ${{ vars.HUBSPOT_FORM_ID }}
        run: |
          if [ -z "$HUBSPOT_PORTAL_ID" ] || [ -z "$HUBSPOT_FORM_ID" ]; then
            echo "::error::HUBSPOT_PORTAL_ID and HUBSPOT_FORM_ID must be set as Actions variables"
            exit 1
          fi
          node -e '
            const { env } = process;
            const attributes = {
              src: `/contact-form.js?v=${env.CONTACT_FORM_VERSION}`,
              "data-portal-id": env.HUBSPOT_PORTAL_ID,
              "data-form-id": env.HUBSPOT_FORM_ID,
              "data-header": env.CONTACT_FORM_HEADER,
              "data-description": env.CONTACT_FORM_DESCRIPTION,
              "data-submit-label": env.CONTACT_FORM_SUBMIT_LABEL,
              "data-arm-delay": env.CONTACT_FORM_ARM_DELAY,
              "data-footer": env.CONTACT_FORM_FOOTER,
              "data-footer-link-label": env.CONTACT_FORM_FOOTER_LINK_LABEL,
              "data-footer-link-url": env.CONTACT_FORM_FOOTER_LINK_URL,
            };
            const escape = (value) => value.replace(/&/g, "&amp;").replace(/"/g, "&quot;");
            const rendered = Object.entries(attributes)
              .map(([name, value]) => `${name}="${escape(value)}"`)
              .join(" ");
            process.stdout.write(`<script ${rendered} defer></script>\n`);
          ' > deploy/ai-studio/contact-form/script-tag.html

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/ai-studio/Dockerfile
          target: web-demo
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.APP }}:${{ steps.tag.outputs.value }}-web
            ${{ env.REGISTRY }}/${{ env.APP }}:latest-web
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.APP }}:latest-web
          cache-to: type=inline
          build-args: |
            VITE_BACKEND_URL=

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The VM runs the repo's compose files, shipped here on every deploy (base64,
      # so the script stays free of quoting). Compose is run from the project
      # directory, not with -f: that is what applies docker-compose.override.yml
      # by default.
      #
      # .env is generated in full from the repo secrets/vars on every deploy,
      # so nothing on the VM is edited by hand. It holds the image tags too: an
      # export dies with this shell, and the next `docker compose up -d worker`
      # on the VM would fall back to the local ai-studio-* names.
      - name: Refresh docker compose on Azure VM
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.APP }}:${{ needs.build-and-push.outputs.image_tag }}
          # repo-level secrets for credentials, vars for the rest — no `environment:`,
          # which would change the OIDC subject the Azure federated credential trusts
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          TEMPORAL_DB_PASSWORD: ${{ secrets.TEMPORAL_DB_PASSWORD }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          RATE_LIMIT_EXECUTE_PER_MINUTE: ${{ vars.RATE_LIMIT_EXECUTE_PER_MINUTE || '10' }}
          RATE_LIMIT_EXECUTE_PER_DAY: ${{ vars.RATE_LIMIT_EXECUTE_PER_DAY || '50' }}
        run: |
          # the databases keep the password they were created with — an empty one
          # would fall back to the compose default and lock the apps out
          : "${APP_DB_PASSWORD:?set secret APP_DB_PASSWORD}" "${TEMPORAL_DB_PASSWORD:?set secret TEMPORAL_DB_PASSWORD}"
          # .env is generated in full on every deploy; single quotes keep values literal
          ENV_B64=$(for k in AI_API_KEY AI_BASE_URL AI_MODEL TAVILY_API_KEY \
                RATE_LIMIT_EXECUTE_PER_MINUTE RATE_LIMIT_EXECUTE_PER_DAY \
                APP_DB_PASSWORD TEMPORAL_DB_PASSWORD; do
              printf "%s='%s'\n" "$k" "${!k}"
            done | cat - <(printf "RUNTIME_IMAGE='%s'\nWEB_IMAGE='%s'\n" "$IMAGE-runtime" "$IMAGE-web") | base64 -w0)
          COMPOSE_B64=$(base64 -w0 deploy/ai-studio/docker-compose.yml)
          OVERRIDE_B64=$(base64 -w0 deploy/ai-studio/docker-compose.override.yml)
          SCRIPT=$(cat <<EOF
          set -e
          cd /app/ai-studio
          echo "$COMPOSE_B64" | base64 -d > docker-compose.yml
          echo "$OVERRIDE_B64" | base64 -d > docker-compose.override.yml
          (umask 077; echo "$ENV_B64" | base64 -d > .env)
          az acr login --name ${{ vars.AZURE_REGISTRY_NAME }}
          docker compose pull
          docker compose up -d --no-build --force-recreate --remove-orphans
          echo DEPLOY_SCRIPT_SUCCEEDED
          EOF
          )
          OUTPUT=$(az vm run-command invoke \
            --name ${{ vars.AI_STUDIO_VM_NAME }} \
            --resource-group ${{ vars.AI_STUDIO_VM_RG }} \
            --command-id RunShellScript \
            --scripts "$SCRIPT")
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q DEPLOY_SCRIPT_SUCCEEDED
