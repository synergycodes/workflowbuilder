packages:
  - './apps/*'
  - './packages/*'

catalog:
  # Exact-pinned: the keep-mounted modal relies on Base UI's transition
  # lifecycle, and this range ships to consumers. Bump = visual pass over
  # overlay transitions.
  '@base-ui/react': 1.7.0
  '@phosphor-icons/core': ^2.1.1
  '@phosphor-icons/react': ^2.1.7
  '@xyflow/react': 12.10.0
  # Exact-pinned (no caret): React 19 hard-requires react and react-dom to be
  # the SAME version — a mismatch throws React error #527. A caret let `react`
  # drift to a newer 19.x than `react-dom` and broke the app. Bump both together.
  'react': 19.1.0
  '@types/react': 19.1.8
  'react-dom': 19.1.0
  # Must match react - bump together.
  'react-is': 19.1.0
  'ajv': ^8.18.0
  # Temporal SDK. @workflowbuilder/temporal declares worker/workflow/client as peers,
  # so the repo keeps one version across the package and both reference apps — the
  # peer range we publish is then exactly what we test against. Bump together.
  '@temporalio/client': ^1.16.0
  '@temporalio/plugin': ^1.16.0
  '@temporalio/worker': ^1.16.0
  '@temporalio/workflow': ^1.16.0

useNodeVersion: 22.12.0
engineStrict: true
